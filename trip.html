<!DOCTYPE html>
<html lang="zh-CN" data-lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trip</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="assets/css/trip.css">
</head>
<body>
<div id="sidebar"></div>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module">

  import { mountTrip } from "./js/trip/app.js";
  const id = new URLSearchParams(location.search).get("trip") || "";
  if (!/^[a-z0-9_-]+$/i.test(id)) {
    document.getElementById("sidebar").textContent = "缺少或无效的 ?trip= 参数 / Missing or invalid ?trip= parameter";
  } else {
    import(`./data/${id}/index.js`)
      .then(m => mountTrip(m.default))
      .catch(err => {
        console.error(err);
        document.getElementById("sidebar").textContent = `找不到行程 / Trip not found: ${id}`;
      });
  }
</script>
</body>
</html>
